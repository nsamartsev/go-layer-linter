name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Run tests and vet
        run: |
          go test ./...
          go vet ./...
          go build ./...

      - name: Verify sample projects
        run: |
          go run ./cmd/go-layer-linter run --dir ./samples/ddd-project
          go run ./cmd/go-layer-linter run --dir ./samples/testproject

      - name: Verify violation exit status
        shell: bash
        run: |
          set +e
          output=$(go run ./cmd/go-layer-linter run --dir ./samples/invalid-project 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "forbidden layer import" <<< "$output"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build and package
        shell: bash
        run: |
          mkdir -p dist package/licenses
          binary="go-layer-linter_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then binary="${binary}.exe"; fi
          CGO_ENABLED=0 go build -trimpath -o "dist/${binary}" ./cmd/go-layer-linter
          cp "dist/${binary}" package/
          cp LICENSE THIRD_PARTY_NOTICES.md package/
          cp licenses/*.txt package/licenses/
          archive="go-layer-linter_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd package && zip -q -r "../dist/${archive}.zip" .)
          else
            (cd package && tar -czf "../dist/${archive}.tar.gz" .)
          fi
          (cd dist && sha256sum "${archive}."* > "${archive}.sha256")

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
