name: Go Layer Linter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Analyze DDD sample
        run: go run ./cmd/go-layer-linter run --dir ./samples/ddd-project

      - name: Analyze layered sample
        run: go run ./cmd/go-layer-linter run --dir ./samples/testproject

      - name: Build and run the Docker image
        run: |
          docker build -t go-layer-linter .
          docker run --rm -v "${{ github.workspace }}/samples/ddd-project:/app" go-layer-linter run --dir /app

      - name: Verify violations fail the command
        shell: bash
        run: |
          set +e
          output=$(go run ./cmd/go-layer-linter run --dir ./samples/invalid-project 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq "forbidden layer import" <<< "$output"
          grep -Fq "forbidden import in domain" <<< "$output"
